<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="lines" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Rail track lines (three horizontal bars representing a carousel track) -->
  <g stroke="url(#lines)" stroke-width="32" stroke-linecap="round" fill="none">
    <line x1="112" y1="176" x2="400" y2="176"/>
    <line x1="112" y1="256" x2="336" y2="256"/>
    <line x1="112" y1="336" x2="400" y2="336"/>
  </g>
  <!-- Active slide indicator (small circle on middle track) -->
  <circle cx="368" cy="256" r="20" fill="#ffffff" opacity="0.9"/>
</svg>
